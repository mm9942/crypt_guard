name: RustTests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Jobs only read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cryptographic core through the facade (pre-workspace lanes).
          - name: default
            args: cargo test -p crypt_guard -p crypt_guard_core --verbose
          - name: ml-lane
            args: cargo test -p crypt_guard -p crypt_guard_core --no-default-features --features ml-kem-backend,ml-dsa-backend --verbose
          - name: legacy-lane
            args: cargo test -p crypt_guard -p crypt_guard_core --no-default-features --features legacy-pqclean --verbose
          # CGv2 migration surface, including the typestate compile-fail cases.
          - name: cgv2-lane
            args: cargo test -p crypt_guard -p crypt_guard_core --features cgv2-compat --verbose
          # Runs the legacy unit-test tree in crates/core/src/tests.
          - name: cgv2-legacy-lane
            args: cargo test -p crypt_guard -p crypt_guard_core --features cgv2-compat,legacy-pqclean --verbose
          - name: slhdsa-lane
            args: cargo test -p crypt_guard_core --features sign-slhdsa --verbose
          # Service and transport layers.
          - name: service
            args: cargo test -p crypt_guard_service --all-features --verbose
          - name: hyper
            args: cargo test -p crypt_guard_hyper --verbose
          - name: facade-service
            args: cargo test -p crypt_guard --features service --verbose
          - name: facade-hyper
            args: cargo test -p crypt_guard --features hyper --verbose

    steps:
    - uses: actions/checkout@v4
    - name: Run ${{ matrix.name }} tests
      run: ${{ matrix.args }}

  feature-matrix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Every core feature compiles on its own
      run: |
        for f in ml-kem-backend ml-dsa-backend sign-slhdsa cgv2-compat legacy-pqclean \
                 aes-ctr aes-xts legacy-aes aes-gcm-siv-cipher archive zip; do
          echo "::group::$f"
          cargo check -p crypt_guard_core --no-default-features --features "$f"
          echo "::endgroup::"
        done
    - name: Examples build
      run: cargo build --examples --features cgv2-compat,legacy-pqclean
    - name: Fuzz targets still compile
      run: cargo check --manifest-path fuzz/Cargo.toml

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install clippy
      run: rustup component add clippy
    # Non-test code in the v3 modules denies unwrap/expect (panic-freedom
    # contract, see SECURITY.md); every lane must stay warning-free.
    - name: Clippy (all features)
      run: cargo clippy --workspace --all-features --all-targets -- -D warnings
    - name: Clippy (default features)
      run: cargo clippy --workspace --all-targets -- -D warnings

  supply-chain:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: cargo deny (advisories, licences, sources)
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check
        arguments: --all-features

  dependency-gates:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Transport dependencies stay behind their features
      run: ./scripts/check_dep_gates.sh
