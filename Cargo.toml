[workspace]
members = ["crates/*", "crypt_guard_proc"]
exclude = ["old"]
resolver = "2"

# Single source of truth for the lockstep version of all published crates.
# Bump it with `cargo release` (see release.toml), never by hand.
[workspace.package]
version = "3.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mm9942/crypt_guard"

# Internal crates: path for development, version for crates.io.
[workspace.dependencies]
crypt_guard_proc    = { path = "crypt_guard_proc", version = "3.1.0" }
crypt_guard_core    = { path = "crates/core", version = "3.1.0", default-features = false }
crypt_guard_service = { path = "crates/service", version = "3.1.0" }
crypt_guard_hyper   = { path = "crates/hyper", version = "3.1.0" }

[package]
name = "crypt_guard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CryptGuard is a post-quantum cryptography framework with NIST FIPS 203/204/205 (ML-KEM, ML-DSA, SLH-DSA) plus legacy Kyber/Falcon/Dilithium, combined with AES and XChaCha20."

# Release automation (cargo-release, see release.toml). The checks and the
# README/CHANGELOG rewrites run once, from the facade crate.
[package.metadata.release]
pre-release-hook = ["scripts/release_checks.sh", "{{version}}"]
pre-release-replacements = [
  { file = "README.md", search = "^# CryptGuard v[0-9]+\\.[0-9]+\\.[0-9]+", replace = "# CryptGuard v{{version}}", exactly = 1 },
  { file = "README.md", search = "crates\\.io-v[0-9]+\\.[0-9]+\\.[0-9]+-blue", replace = "crates.io-v{{version}}-blue", exactly = 1 },
  { file = "README.md", search = "docs-v[0-9]+\\.[0-9]+\\.[0-9]+-yellow", replace = "docs-v{{version}}-yellow", exactly = 1 },
  { file = "README.md", search = "crypt_guard = \"[0-9]+\\.[0-9]+\\.[0-9]+\"", replace = "crypt_guard = \"{{version}}\"", exactly = 1 },
  { file = "README.md", search = "crypt_guard = \\{ version = \"[0-9]+\\.[0-9]+\\.[0-9]+\"", replace = "crypt_guard = { version = \"{{version}}\"", min = 0 },
  { file = "src/lib.rs", search = "^//! # CryptGuard v[0-9]+\\.[0-9]+\\.[0-9]+", replace = "//! # CryptGuard v{{version}}", exactly = 1 },
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]

# `crypt_guard` is the public facade. The cryptography lives in
# `crypt_guard_core`; the optional service and transport layers are separate
# crates pulled in only through the `service` / `hyper` features, so the
# default build never depends on Tower, Hyper, http-body or Tokio.
[features]
default = [
    "ml-kem-backend",
    "ml-dsa-backend",
]

# ── Cryptographic core (mirrors crypt_guard_core features 1:1) ────────────────
cgv2-compat              = ["crypt_guard_core/cgv2-compat"]
ml-kem-backend           = ["crypt_guard_core/ml-kem-backend"]
ml-dsa-backend           = ["crypt_guard_core/ml-dsa-backend", "crypt_guard_service?/ml-dsa"]
sign-slhdsa              = ["crypt_guard_core/sign-slhdsa"]
legacy-pqclean           = ["crypt_guard_core/legacy-pqclean"]
aes-gcm-siv-cipher       = ["crypt_guard_core/aes-gcm-siv-cipher"]
xchacha20poly1305-cipher = ["crypt_guard_core/xchacha20poly1305-cipher"]
aes-ctr                  = ["crypt_guard_core/aes-ctr"]
aes-xts                  = ["crypt_guard_core/aes-xts"]
legacy-aes               = ["crypt_guard_core/legacy-aes"]
archive                  = ["crypt_guard_core/archive"]
zip                      = ["crypt_guard_core/zip"]

# ── Service / transport layers ────────────────────────────────────────────────
# Typed Tower crypto service. No HTTP, no Hyper.
service = ["dep:crypt_guard_service"]
# Hyper adapter on top of the service layer.
hyper = ["service", "dep:crypt_guard_hyper"]

[dependencies]
crypt_guard_core    = { workspace = true }
crypt_guard_service = { workspace = true, optional = true }
crypt_guard_hyper   = { workspace = true, optional = true }

[dev-dependencies]
hex = "0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tempfile = "3.10.1"
trybuild = "=1.0.117"
turboshake = { version = "=0.7.1", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.8.1", features = ["derive"] }

# ── Example declarations ─────────────────────────────────────────────────────
[[example]]
name = "pq_hpke"
path = "examples/pq_hpke.rs"

[[example]]
name = "encrypt_aes"
path = "examples/encrypt_aes.rs"
required-features = ["ml-kem-backend", "cgv2-compat"]

[[example]]
name = "encrypt_xchacha"
path = "examples/encrypt_xchacha.rs"
required-features = ["ml-kem-backend", "cgv2-compat"]

[[example]]
name = "macro_example"
path = "examples/macro_example.rs"
required-features = ["legacy-pqclean"]

[[example]]
name = "signed_message"
path = "examples/signed_message.rs"
required-features = ["legacy-pqclean"]
